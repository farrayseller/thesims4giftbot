<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Установка игры The Sims 4</title>

    <!-- Иконка сайта -->
    <link
        rel="icon"
        type="image/jpeg"
        href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1222670/ca6bc8b2411bce4a2cd325ab75f0204bc3a4ad98.jpg"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #e8edf2;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(45, 105, 145, 0.20),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #0c1117 0%,
                    #111922 50%,
                    #0b1016 100%
                );
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        /* Карточка */

        .card {
            position: relative;

            padding: 46px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(27, 38, 50, 0.96),
                    rgba(17, 25, 34, 0.97)
                );

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                0 0 50px rgba(55, 145, 200, 0.06);

            overflow: hidden;
        }

        /* Небольшой свет сверху карточки */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 12%;
            right: 12%;

            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(103, 193, 245, 0.7),
                transparent
            );
        }

        /* Верх */

        .header {
            text-align: center;

            margin-bottom: 38px;
        }

        .icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    #214f6c,
                    #173347
                );

            border: 1px solid rgba(103, 193, 245, 0.18);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

            overflow: hidden;
        }

        .icon img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        h1 {
            margin: 0;

            color: #ffffff;

            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.4px;
        }

        .subtitle {
            margin: 12px auto 0;

            max-width: 480px;

            color: #8996a3;

            font-size: 15px;
            line-height: 1.6;
        }

        /* Основной блок */

        .install-box {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;

            padding: 22px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.18);

            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .install-info {
            min-width: 0;
        }

        .install-title {
            margin-bottom: 7px;

            color: #e9eef3;

            font-size: 15px;
            font-weight: 500;
        }

        .install-description {
            color: #788592;

            font-size: 13px;
            line-height: 1.5;
        }

        /* Кнопка */

        .steam-button {
            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 13px 23px;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #66c0f4,
                    #3b9bd0
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            box-shadow:
                0 7px 22px rgba(58, 157, 210, 0.22);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;
        }

        .steam-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 10px 28px rgba(58, 157, 210, 0.32);
        }

        .steam-button:active {
            transform: translateY(0);
        }

        .button-icon {
            margin-right: 8px;

            font-size: 13px;
        }

        /* Разделитель */

        .divider {
            height: 1px;

            margin: 34px 0;

            background:
                rgba(255, 255, 255, 0.07);
        }

        /* Благодарность */

        .thanks {
            text-align: center;
        }

        .thanks-title {
            margin-bottom: 10px;

            color: #dce3e9;

            font-size: 15px;
        }

        .thanks-title a {
            color: #66c0f4;

            font-weight: 600;

            text-decoration: none;

            transition: color 0.15s ease;
        }

        .thanks-title a:hover {
            color: #8bd5ff;

            text-decoration: underline;
        }

        .thanks-text {
            max-width: 470px;

            margin: 0 auto;

            color: #707d89;

            font-size: 13px;

            line-height: 1.6;
        }

        /* Низ */

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #4f5b66;

            font-size: 11px;
        }

        /* Мобильная версия */

        @media (max-width: 600px) {

            body {
                padding: 20px 14px;
            }

            .card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 24px;
            }

            .install-box {
                flex-direction: column;

                align-items: stretch;

                gap: 18px;
            }

            .steam-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="header">

                <div class="icon">
                    <img
                        src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1222670/library_600x900_2x.jpg"
                        alt="The Sims 4"
                    >
                </div>

                <h1>
                    The Sims 4
                </h1>

                <p class="subtitle">
                    Нажмите кнопку ниже, чтобы открыть Steam
                    и начать установку.
                </p>

            </div>


            <div class="install-box">

                <div class="install-info">

                    <div class="install-title">
                        Игра готова к установке
                    </div>

                    <div class="install-description">
                        Steam откроется после нажатия кнопки.
                    </div>

                </div>


                <a
                    class="steam-button"
                    href="steam://install/1222670"
                >
                    <span class="button-icon">▶</span>
                    Открыть Steam
                </a>

            </div>


            <div class="divider"></div>


            <div class="thanks">

                <div class="thanks-title">
                    Спасибо за покупку у продавца
                    <a
                        href="https://playerok.com/profile/Farray/products"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Farray
                    </a>
                </div>

                <p class="thanks-text">
                    Желаем приятной игры и хорошего времяпровождения!
                </p>

            </div>

        </section>

    </main>

</body>
</html>
